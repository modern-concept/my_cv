<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danillo Xavier — Portfólio</title>
<meta name="description" content="Danillo Xavier: IA, automação, dados e pesquisa aplicada ao agronegócio. Cases, projetos, trajetória e competências.">
<meta name="theme-color" content="#0B110D">
<script>
// Old CV links used these params on "/"; German and cover letters only exist in cv.html.
(function(){ var q = new URLSearchParams(location.search); if (!(q.has("version") || q.has("print") || q.has("cover"))) return; var full = q.get("version") === "full" && !q.has("cover") && q.get("lang") !== "de" && q.get("print") !== "cover"; location.replace((full ? "cv-completo.html" : "cv.html") + location.search + location.hash); })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 36C20 25 13 18 5 15c0 11 6 18 15 21Z' fill='%238BD17C'/%3E%3Cpath d='M20 36c0-14 6-25 16-30-1 15-6 25-16 30Z' fill='%23E9C46A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html:has(dialog[open]){overflow:hidden}
:root{
  --bg:#0B110D;--panel:rgba(20,32,24,.72);--line:rgba(200,230,190,.13);
  --text:#ECF2E8;--muted:#A9B8A6;--soft:#D3DDCF;
  --leaf:#8BD17C;--wheat:#E9C46A;--sky:#6FC6C9;--violet:#B79CFF;
  --radius:18px;--ease:cubic-bezier(.2,.8,.2,1);
}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 600px at 85% -10%,rgba(233,196,106,.07),transparent 60%),
             radial-gradient(900px 700px at -10% 45%,rgba(79,163,90,.09),transparent 60%)}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
kbd{font:600 11px "JetBrains Mono",monospace;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--wheat);color:#1a1405;padding:10px 14px;border-radius:10px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:2px solid var(--wheat);outline-offset:3px;border-radius:8px}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto;position:relative;z-index:1}
.progress{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--leaf),var(--wheat),var(--sky));z-index:60}
.glow{position:fixed;width:560px;height:560px;left:0;top:0;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(139,209,124,.09),transparent 60%);transform:translate3d(-999px,-999px,0)}
@media (pointer:coarse){.glow{display:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* topbar */
.topbar{position:fixed;inset:0 0 auto 0;z-index:50;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
.topbar.solid,.topbar.menu-open{background:rgba(11,17,13,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.topbar.menu-open{background:#0B110D}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 15px Inter;letter-spacing:.02em;min-height:44px;white-space:nowrap}
.brand svg{width:32px;height:32px;flex:0 0 32px;transition:transform .5s var(--ease)}
.brand:hover svg{transform:rotate(-12deg) scale(1.08)}
.nav{margin-left:auto;display:flex;gap:2px}
.nav a{text-decoration:none;font:500 14px Inter;color:var(--muted);padding:0 11px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center;transition:color .2s,background .2s}
.nav a:hover{color:var(--text);background:rgba(139,209,124,.1)}
.nav a.active{color:var(--leaf);background:rgba(139,209,124,.12)}
.icon-btn{min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font:700 13px "JetBrains Mono",monospace;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;transition:border-color .2s,background .2s;text-decoration:none;flex:0 0 auto}
.icon-btn:hover{border-color:var(--leaf);background:rgba(139,209,124,.1)}
.icon-btn svg{width:16px;height:16px}
.cv-top{color:var(--leaf);border-color:rgba(139,209,124,.45)}
.pal-btn kbd{font-size:10.5px}
.menu-btn{display:none}
@media (max-width:1240px){
  .menu-btn{display:inline-flex}
  .pal-btn{margin-left:auto}
  .nav{position:fixed;top:68px;left:0;right:0;flex-direction:column;padding:10px 20px 20px;background:#0B110D;box-shadow:0 30px 60px -20px rgba(0,0,0,.8);border-bottom:1px solid var(--line);transform:translateY(-10px);opacity:0;visibility:hidden;transition:.25s var(--ease);max-height:calc(100vh - 68px);overflow:auto}
  .nav.open{transform:none;opacity:1;visibility:visible}
  .nav a{font-size:17px;min-height:48px;padding:0 14px}
}
@media (max-width:620px){.pal-btn kbd,.pal-btn .lbl{display:none}.pal-btn{padding:0}}
@media (max-width:440px){.brand span{display:none}.topbar .wrap{gap:8px}}

/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;overflow:hidden;padding:110px 0 110px}
#field{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(11,17,13,.86),rgba(11,17,13,.55) 36%,rgba(11,17,13,0) 52%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:28%;z-index:1;pointer-events:none;background:linear-gradient(transparent,var(--bg))}
.hero-inner{position:relative;z-index:2;max-width:880px;will-change:transform}
@media (min-width:900px){.hero-inner{max-width:min(880px,45vw)}}
@media (max-width:899px){#field{opacity:.42}.hero::before{background:linear-gradient(180deg,rgba(11,17,13,.75),rgba(11,17,13,.55) 60%,rgba(11,17,13,.2))}}
.eyebrow{font:700 11.5px "JetBrains Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--wheat);display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid rgba(233,196,106,.3);border-radius:999px;background:rgba(11,17,13,.55);opacity:0;animation:fadeUp .8s .1s var(--ease) forwards}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(139,209,124,.6)}70%,100%{box-shadow:0 0 0 10px rgba(139,209,124,0)}}
.hero h1{font:800 clamp(3.2rem,10.5vw,7.8rem)/.92 Fraunces,Georgia,serif;letter-spacing:-.03em;margin:22px 0 16px}
.hero h1 .line{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .line>span{display:inline-block;transform:translateY(110%);animation:rise 1.1s var(--ease) forwards}
.hero h1 .line:nth-child(2)>span{background:linear-gradient(100deg,var(--leaf),var(--wheat) 45%,var(--sky) 75%,var(--leaf));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.1s .14s var(--ease) forwards,shimmer 9s linear infinite}
@keyframes rise{to{transform:none}}
@keyframes shimmer{to{background-position:220% 0}}
.typed{font:500 clamp(1rem,2.3vw,1.3rem) "JetBrains Mono",monospace;color:var(--sky);min-height:1.7em;margin:0;opacity:0;animation:fadeUp .8s .45s var(--ease) forwards}
.typed .prompt{color:var(--leaf);margin-right:.6ch}
.typed .caret{display:inline-block;width:.55ch;height:1.05em;background:var(--sky);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:560px){.typed{min-height:3.4em}}
.lead{font-size:clamp(1.05rem,1.8vw,1.24rem);color:var(--soft);max-width:660px;margin:18px 0 28px;opacity:0;animation:fadeUp .8s .6s var(--ease) forwards}
.cta{display:flex;flex-wrap:wrap;gap:12px;opacity:0;animation:fadeUp .8s .75s var(--ease) forwards}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font:600 15px Inter;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:rgba(11,17,13,.55);transition:transform .25s var(--ease),background .25s,border-color .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);border-color:var(--leaf)}
.btn svg{width:18px;height:18px;transition:transform .25s var(--ease)}
.btn:hover svg{transform:translateX(3px)}
.btn.primary{background:linear-gradient(135deg,var(--leaf),#5DBB6A);color:#0B1A0E;border-color:transparent;box-shadow:0 10px 30px -10px rgba(139,209,124,.6)}
.btn.primary:hover{box-shadow:0 18px 40px -12px rgba(139,209,124,.85)}
.btn.small{min-height:40px;padding:0 16px;font-size:14px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;padding:0;list-style:none}
.fact{font:500 13px Inter;color:var(--soft);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(11,17,13,.6);opacity:0;animation:fadeUp .7s var(--ease) forwards;animation-delay:calc(.9s + var(--i) * .08s)}
.scroll-hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;font:500 10.5px "JetBrains Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;min-height:44px}
.scroll-hint .mouse{width:22px;height:34px;border:1.5px solid var(--muted);border-radius:12px;position:relative}
.scroll-hint .mouse::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--leaf);animation:wheel 1.8s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(-3px)}30%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
@media (max-height:640px){.scroll-hint{display:none}}

/* sections */
.section{padding:clamp(80px,11vw,140px) 0;position:relative}
.s-head{margin-bottom:clamp(30px,5vw,54px);max-width:780px}
.kicker{font:700 12px "JetBrains Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--leaf);display:flex;align-items:center;gap:12px}
.kicker::after{content:"";height:1px;width:60px;background:linear-gradient(90deg,var(--leaf),transparent)}
.s-head h2{font:700 clamp(2.1rem,5vw,3.5rem)/1.06 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:14px 0 12px}
.s-head p{color:var(--muted);margin:0;font-size:1.05rem}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.note{font-size:.86rem;color:var(--muted);margin:10px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font:600 14px Inter;color:var(--muted);transition:color .2s,border-color .2s,background .2s}
.pill:hover{color:var(--text);border-color:rgba(139,209,124,.55)}
.pill[aria-pressed="true"],.pill[aria-selected="true"]{background:var(--leaf);border-color:var(--leaf);color:#0B1A0E}
.pill .cnt{font:700 11px "JetBrains Mono",monospace;opacity:.7;margin-left:6px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.badges[hidden]{display:none}
.badge{font:600 12.5px Inter;padding:6px 11px;border-radius:999px;background:rgba(233,196,106,.1);color:var(--wheat);border:1px solid rgba(233,196,106,.28)}
.tech{display:flex;flex-wrap:wrap;gap:6px}
.tech span{font:500 12px "JetBrains Mono",monospace;padding:5px 9px;border-radius:8px;background:rgba(111,198,201,.08);color:var(--sky);border:1px solid rgba(111,198,201,.22)}
.t-list{margin:0 0 14px;padding-left:20px;color:var(--soft)}
.t-list li{margin-bottom:8px}
.t-list li::marker{color:var(--leaf)}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search input{width:100%;min-height:44px;padding:0 16px 0 42px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:500 15px Inter;transition:border-color .2s,background .2s}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--leaf);background:rgba(139,209,124,.06)}
.search svg{position:absolute;left:15px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.rel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.rel>span{font:700 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.rel button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(139,209,124,.35);background:rgba(139,209,124,.08);color:var(--leaf);font:600 13px Inter;cursor:pointer;transition:background .2s,transform .2s var(--ease)}
.rel button:hover{background:rgba(139,209,124,.18);transform:translateY(-2px)}

/* about */
#about{overflow-x:hidden;overflow-x:clip}
.about{display:grid;grid-template-columns:minmax(260px,.8fr) 1.2fr;gap:clamp(28px,5vw,64px);align-items:center}
.portrait{position:relative;aspect-ratio:1;max-width:380px;width:100%;margin-inline:auto}
.portrait .ring{position:absolute;inset:0;border-radius:50%;border:1.5px dashed rgba(139,209,124,.45);animation:spin 40s linear infinite}
.portrait .ring.r2{inset:7%;border:1px solid rgba(233,196,106,.25);animation-duration:55s;animation-direction:reverse}
.portrait .ring::before{content:"";position:absolute;top:-6px;left:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--leaf);box-shadow:0 0 18px var(--leaf)}
.portrait .ring.r2::before{background:var(--wheat);box-shadow:0 0 18px var(--wheat)}
.portrait .photo{position:absolute;inset:15%;border-radius:50%;overflow:hidden;background:#1a261d;box-shadow:0 30px 80px -30px rgba(0,0,0,.8),inset 0 0 0 1px var(--line)}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait .tag{position:absolute;font:700 11px "JetBrains Mono",monospace;letter-spacing:.08em;padding:8px 12px;border-radius:999px;background:rgba(11,17,13,.88);border:1px solid var(--line);white-space:nowrap;animation:float 6s ease-in-out infinite}
.portrait .tag.t1{top:8%;right:-4%;color:var(--leaf)}
.portrait .tag.t2{bottom:12%;left:-6%;color:var(--wheat);animation-delay:-2s}
.portrait .tag.t3{bottom:-2%;right:10%;color:var(--sky);animation-delay:-4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
.about-text p{font-size:1.08rem;color:var(--soft);margin:0 0 16px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.pillar{padding:18px;position:relative;overflow:hidden;transition:transform .3s var(--ease),border-color .3s}
.pillar:hover{transform:translateY(-3px);border-color:var(--pc)}
.pillar .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pc);margin-bottom:12px}
.pillar .ic svg{width:20px;height:20px}
.pillar h3{font:700 1.05rem Inter;margin:0 0 6px}
.pillar p{font-size:.92rem!important;color:var(--muted)!important;margin:0!important;line-height:1.5}
.id-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.id-card{padding:14px 18px}
.id-card .k{font:700 11px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--wheat)}
.id-card .v{font-weight:600;margin-top:4px;line-height:1.4}
@media (max-width:980px){.pillars{grid-template-columns:1fr}}
@media (max-width:860px){.about{grid-template-columns:1fr}.portrait{max-width:300px}}
@media (max-width:520px){.id-grid{grid-template-columns:1fr}.portrait .tag{font-size:10px}}

/* impact */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}
.stat{padding:26px 22px;position:relative;overflow:hidden}
.stat .num{font:800 clamp(2.5rem,5vw,3.6rem)/1 Fraunces,Georgia,serif;background:linear-gradient(135deg,var(--text),var(--leaf));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.stat .lbl{color:var(--muted);margin-top:10px;font-size:.95rem;line-height:1.45}
.stat::after{content:"";position:absolute;right:-34px;bottom:-34px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(139,209,124,.2),transparent 70%)}
.i-group{margin-top:26px}
.i-group h3{font:700 1.2rem Fraunces,Georgia,serif;margin:0 0 4px}
.i-group>.note{margin:0 0 14px}
.harvest{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.harvest.four{grid-template-columns:repeat(4,1fr)}
.h-card{padding:22px;display:flex;gap:16px;align-items:flex-start;transition:transform .35s var(--ease),border-color .35s}
.h-card:hover{transform:translateY(-4px);border-color:rgba(233,196,106,.45)}
.h-card .ic{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(233,196,106,.1);color:var(--wheat)}
.h-card .ic svg{width:22px;height:22px}
.h-card .n{font:700 1.35rem/1.2 Fraunces,Georgia,serif;color:var(--wheat)}
.h-card p{margin:6px 0 0;color:#C9D4C5;font-size:.95rem;line-height:1.5}
.harvest.four .h-card{flex-direction:column;gap:6px}
.harvest.four .h-card .n{font-size:1.8rem;color:var(--sky)}
@media (max-width:960px){.stats{grid-template-columns:repeat(2,1fr)}.harvest,.harvest.four{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.harvest,.harvest.four{grid-template-columns:1fr}}

/* cases */
.cases{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.case-tabs{display:grid;gap:6px;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;scrollbar-width:thin;padding:2px}
.case-tab{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:center;padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.025);transition:border-color .25s,background .25s,transform .25s var(--ease)}
.case-tab:hover{border-color:hsl(var(--h) 60% 60% / .6);transform:translateX(3px)}
.case-tab:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
.case-tab[aria-selected="true"]{border-color:hsl(var(--h) 60% 60%);background:hsl(var(--h) 40% 20% / .55)}
.case-tab>span:last-child{min-width:0}
.case-tab .g{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font:800 13px "JetBrains Mono",monospace;color:#08140B;background:linear-gradient(135deg,hsl(var(--h) 65% 68%),hsl(calc(var(--h) + 40) 60% 55%))}
.case-tab b{display:block;font:700 14px/1.3 Inter}
.case-tab small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-panel{overflow:hidden;min-height:560px}
.case-panel .cover{height:150px}
.case-body{padding:24px clamp(18px,3vw,30px) 26px}
.case-body.swap>*{animation:fadeUp .5s var(--ease) both}
.case-body.swap>*:nth-child(2){animation-delay:.04s}
.case-body.swap>*:nth-child(3){animation-delay:.08s}
.case-body.swap>*:nth-child(4){animation-delay:.12s}
.case-body.swap>*:nth-child(5){animation-delay:.16s}
.case-ctx{font:700 11.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--wheat)}
.case-title{font:800 clamp(1.5rem,3.4vw,2.2rem)/1.12 Fraunces,Georgia,serif;margin:8px 0 10px}
.case-problem{color:var(--soft);font-size:1.05rem;margin:0 0 18px}
.case-body h4{font:700 11.5px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--leaf);margin:20px 0 10px}

/* accordion (timeline + education) */

.lab{padding:22px}
.lab-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lab-title{font:700 12px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--wheat)}
.lab-ctrl{display:flex;gap:8px}
.genes{display:grid;gap:4px}
.genome{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;padding:4px;border-radius:8px;transition:background .3s}
.genome.best{background:rgba(139,209,124,.12);box-shadow:inset 0 0 0 1px rgba(139,209,124,.45)}
.gene{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.06);transition:background .35s}
.gene.on{background:rgba(139,209,124,.55)}
.genome.best .gene.on{background:var(--leaf)}
.gene.mut{animation:pop .55s var(--ease)}
@keyframes pop{40%{transform:scale(1.12);background:var(--wheat)}}
.feat-axis{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;padding:0 4px;margin-top:6px;font:500 8.5px "JetBrains Mono",monospace;color:var(--muted);text-align:center}
.lab-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 10px}
.lab-stats div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.lab-stats small{display:block;font:600 10px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lab-stats strong{font:700 1.25rem Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}
.chart{width:100%;height:90px;display:block}
.also{margin-top:22px}
.also h3{font:700 1.1rem Fraunces,Georgia,serif;margin:0 0 10px}
.also ul{margin:0;padding-left:20px;color:var(--soft)}
.also li{margin-bottom:6px}
.also li::marker{color:var(--wheat)}
@media (max-width:920px){.research{grid-template-columns:1fr}}
@media (max-width:420px){.lab-stats{grid-template-columns:1fr 1fr}.feat-axis{display:none}}

/* awards + education */
.awards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;perspective:900px;margin-bottom:34px}
.award{padding:26px 22px;position:relative;overflow:hidden;min-height:250px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,border-color .3s}
.award:hover{border-color:rgba(233,196,106,.5)}
.award .big{font:800 3.3rem/1 Fraunces,Georgia,serif;background:linear-gradient(135deg,var(--wheat),#FFF3C4 45%,var(--leaf));-webkit-background-clip:text;background-clip:text;color:transparent}
.award h3{font:700 1.08rem Inter;margin:16px 0 8px}
.award p{color:var(--muted);margin:0;font-size:.93rem}
.award::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(233,196,106,.15),transparent 45%);opacity:0;transition:opacity .3s}
.award:hover::after{opacity:1}
.award .yr{position:absolute;top:18px;right:18px;font:700 11px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.1em}
.edu{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.e-deg{display:block;font:700 1.12rem/1.3 Fraunces,Georgia,serif;margin-top:8px}
.e-item .acc-pad ul{margin:0;padding-left:20px;color:var(--soft)}
.e-item .acc-pad li{margin-bottom:6px}
.e-item .acc-pad li::marker{color:var(--leaf)}
.e-now{display:inline-block;margin-left:8px;font:700 10px "JetBrains Mono",monospace;letter-spacing:.1em;padding:3px 8px;border-radius:999px;background:var(--wheat);color:#1a1405;vertical-align:middle}
@media (max-width:1020px){.awards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.edu{grid-template-columns:1fr}}
@media (max-width:560px){.awards{grid-template-columns:1fr}.award{min-height:0}}

/* contact */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.contact-card{padding:clamp(30px,6vw,64px);text-align:center;position:relative;border-radius:28px;overflow:hidden}
.contact-card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),var(--leaf),var(--wheat),var(--sky),var(--leaf));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 7s linear infinite;pointer-events:none}
@keyframes rot{to{--a:360deg}}
.contact-card h2{font:800 clamp(2.2rem,6vw,4.2rem)/1.05 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:14px auto 14px;max-width:820px}
.contact-card p{color:var(--soft);max-width:620px;margin:0 auto 28px;font-size:1.08rem}
.contact-card .kicker{justify-content:center}
.contact-card .kicker::before{content:"";height:1px;width:60px;background:linear-gradient(270deg,var(--leaf),transparent)}
.contact-card .cta{justify-content:center;opacity:1;animation:none}
footer{padding:30px 0 40px;color:var(--muted);font-size:.9rem;text-align:center;position:relative;z-index:1}
footer a{color:var(--leaf);display:inline-flex;align-items:center;min-height:44px;padding:0 6px}

/* command palette */
.pal{width:min(680px,calc(100% - 24px));margin-top:10vh;max-height:76vh;padding:0;border:1px solid var(--line);border-radius:20px;background:#0F1812;color:var(--text);overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.9)}
.pal[open]{display:flex;flex-direction:column;animation:dlgIn .35s var(--ease)}
.pal::backdrop{background:rgba(4,7,5,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal-in svg{width:20px;height:20px;color:var(--leaf);flex:0 0 20px}
.pal-in input{flex:1;min-height:44px;border:0;background:transparent;color:var(--text);font:500 17px Inter}
.pal-in input:focus{outline:none}
.pal-list{list-style:none;margin:0;padding:8px;overflow:auto;flex:1;scrollbar-width:thin}
.pal-list button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;min-height:48px}
.pal-list button.act,.pal-list button:hover{background:rgba(139,209,124,.12)}
.pal-list .ty{grid-row:span 2;font:700 10px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--wheat);min-width:86px}
.pal-list b{font:600 14.5px Inter;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-list small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>

{id:"agritech", project:"agritech", hue:95, glyph:"CV",

{id:"lean", project:"sia", hue:205, glyph:"LPG",

/* ---------- reveal & counters ---------- */
function animateCount(el){
  const target = +el.dataset.count, suf = el.dataset.suffix || "";
  if (reduce){ el.textContent = target + suf; return; }
  const t0 = performance.now(), dur = 1600;
  const step = now => { const p = Math.min(1, (now - t0) / dur); el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const io = new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in");
  e.target.querySelectorAll("[data-count]").forEach(animateCount);
  io.unobserve(e.target);
}), {threshold:.12, rootMargin:"0px 0px -6% 0px"});
const observe = () => $$(".reveal:not(.in)").forEach(el => io.observe(el));

/* ---------- typed ---------- */
let typeToken = 0;
function startTyped(roles){
  const el = $("#typedText"), my = ++typeToken;
  $("#typedSr").textContent = roles.join(" · ");
  if (reduce){ el.textContent = roles[0]; return; }
  let r = 0, i = 0, del = false;
  const tick = () => {
    if (my !== typeToken) return;
    const word = roles[r];
    i += del ? -1 : 1;
    el.textContent = word.slice(0, i);
    let d = del ? 26 : 52;
    if (!del && i >= word.length){ d = 1900; del = true; }
    else if (del && i <= 0){ del = false; r = (r + 1) % roles.length; d = 380; }
    setTimeout(tick, d);
  };
  tick();
}

/* ---------- genetic lab ---------- */
const Lab = (() => {
  const N = 16, P = 8;
  let target, pop, prevRows = [], gen, hist, playing = !reduce, visible = false, timer = 0, hold = 0;
  const genesEl = $("#genes");
  const newTarget = () => { const t = Array(N).fill(0); let k = 0; while (k < 5){ const i = Math.floor(Math.random() * N); if (!t[i]){ t[i] = 1; k++; } } return t; };
  const fit = g => { let hit = 0, miss = 0; for (let i = 0; i < N; i++) if (g[i]) target[i] ? hit++ : miss++; return Math.max(0, Math.min(1, hit / 5 - miss * .06)); };
  function reset(){
    target = newTarget();
    pop = Array.from({length:P}, () => Array.from({length:N}, () => (Math.random() < .45 ? 1 : 0)));
    gen = 0; hist = []; hold = 0; prevRows = [];
    genesEl.innerHTML = Array.from({length:P}, () => `<div class="genome">${'<span class="gene"></span>'.repeat(N)}</div>`).join("");
    $("#featAxis").innerHTML = Array.from({length:N}, (_, i) => `<span>F${i + 1}</span>`).join("");
    draw();
  }
  function step(){
    const scored = pop.map(g => ({g, f:fit(g)})).sort((a, b) => b.f - a.f);
    const next = [scored[0].g.slice(), scored[1].g.slice()];
    const pick = () => { const a = scored[Math.floor(Math.random() * P)], b = scored[Math.floor(Math.random() * P)]; return (a.f >= b.f ? a : b).g; };
    while (next.length < P){
      const a = pick(), b = pick(), cut = 1 + Math.floor(Math.random() * (N - 1));
      const child = a.slice(0, cut).concat(b.slice(cut));
      for (let i = 0; i < N; i++) if (Math.random() < 1.2 / N) child[i] ^= 1;
      next.push(child);
    }
    pop = next; gen++; draw();

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const pal = e.target.closest("[data-pal]");
  if (pal){ palRun(+pal.dataset.pal); return; }
  const head = e.target.closest(".acc-head");
  if (head){ const item = head.closest(".acc"); setOpen(item, !item.classList.contains("open")); return; }
  const tab = e.target.closest("[data-case]");
  if (tab){ selectCase(tab.dataset.case); return; }
  const caseGo = e.target.closest("[data-case-go]");
  if (caseGo){ $("#projDialog").close(); selectCase(caseGo.dataset.caseGo); scrollToId("cases"); return; }
  const ecoGo = e.target.closest("[data-eco-go]");
  if (ecoGo){ $("#projDialog").close(); ui.eco = ecoGo.dataset.ecoGo; ui.ecoArea = null; loadExt(); renderEco(); scrollToId("eco"); return; }
  const proj = e.target.closest("[data-project]");
  if (proj){ openProject(proj.dataset.project); return; }
  const pf = e.target.closest("[data-pfilter]");
  if (pf){ ui.pfilter = pf.dataset.pfilter; $$("#projFilters .pill").forEach(b => b.setAttribute("aria-pressed", b.dataset.pfilter === ui.pfilter)); renderProjGrid(); return; }
  const f = e.target.closest("[data-filter]");
  if (f){ ui.filter = f.dataset.filter; applyFilter(); return; }
  const eco = e.target.closest("[data-eco]");
  if (eco){ ui.eco = eco.dataset.eco; ui.ecoArea = null; renderEco(); return; }
  const area = e.target.closest("[data-eco-area]");
  if (area){ ui.ecoArea = area.dataset.ecoArea || null; renderEco(); return; }
  const chip = e.target.closest("[data-chip]");
  if (chip){ ui.chip = ui.chip === chip.dataset.chip ? null : chip.dataset.chip; $$("#techGroups .tchip").forEach(b => b.setAttribute("aria-pressed", b.dataset.chip === ui.chip)); renderPanel(); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump){ jumpTo(jump.dataset.jump); }
});
$("#caseTabs").addEventListener("keydown", e => {
  const keys = {ArrowDown:1, ArrowRight:1, ArrowUp:-1, ArrowLeft:-1};
  if (!(e.key in keys) && e.key !== "Home" && e.key !== "End") return;
  e.preventDefault();
  const i = CASES.findIndex(c => c.id === ui.caseId);
  const n = e.key === "Home" ? 0 : e.key === "End" ? CASES.length - 1 : (i + keys[e.key] + CASES.length) % CASES.length;
  selectCase(CASES[n].id, true);
});

document.addEventListener("keydown", e => {
